<!DOCTYPE html>
<html th:lang="${#locale}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<div class="locale-switcher">
    <span th:text="#{language.change}">Language:</span>
    <a href="?lang=en">English</a> |
    <a href="?lang=ru">Русский</a>
</div>
<!--/*@thymesVar id="authUser" type="com.javarush.jira.login.AuthUser"*/-->

<th:block th:replace="~{layout/main::page(title=#{index.block.title},appMain=~{::appMain})}">
    <appMain>
        <script th:inline="javascript">
            function changeLang(lang) {
                var urlParams = new URLSearchParams(window.location.search);
                urlParams.set('lang', lang);
                window.location.href = window.location.pathname + '?' + urlParams.toString();
            }
        </script>
        <h1 th:text="#{home.page.title}"></h1>
        <button class="btn btn-primary btn-lg mt-3" type="button" onclick="changeLang('ru')">Русский</button>
        <button class="btn btn-primary btn-lg mt-3" type="button" onclick="changeLang('en')">English</button>
        <div th:if="${authUser} != null">
            <form action="/ui/logout" method="post">
                <button class="btn btn-primary btn-lg mt-3" type="submit" th:text="#{user_form.logout}"></button>
            </form>
        </div>
    </appMain>
</th:block>
